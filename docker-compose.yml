services:
  postgres:
    image: postgres:16-alpine
    container_name: aurex-postgres
    environment:
      POSTGRES_DB: financial_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: aurex-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financial_audit
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      SPRING_PROFILES_ACTIVE: prod
      ENABLE_SWAGGER: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

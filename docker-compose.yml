services:
  postgres:
    image: postgres:16-alpine
    container_name: aurex-postgres
    environment:
      POSTGRES_DB: financial_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: aurex-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financial_audit
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      # Profile defaults to 'dev' for local Docker runs.
      # Override with SPRING_PROFILES_ACTIVE=prod for production deployments.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      ENABLE_SWAGGER: "true"
      # JWT_SECRET is required — Compose will fail immediately if not set in the host environment or .env file.
      # Generate with: openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a secure value of at least 32 characters}
      # Admin seeding is disabled by default. Never enable in production.
      AUREX_SEED_ADMIN_ENABLED: ${AUREX_SEED_ADMIN_ENABLED:-false}
      # Only needed when AUREX_SEED_ADMIN_ENABLED=true. No default; startup fails if seeding is enabled without it.
      AUREX_DEV_ADMIN_PASSWORD: ${AUREX_DEV_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

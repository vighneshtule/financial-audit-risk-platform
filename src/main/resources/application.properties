# Spring Application
spring.application.name=financial-audit-risk-platform
server.port=${PORT:8080}

# Database Configuration with Environment Fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financial_audit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Servlet & Multipart Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Springdoc / Swagger UI Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:dev_aurex_super_secret_key_minimum_32_bytes_long_for_hmac_sha256}
jwt.expiration=${JWT_EXPIRATION:86400}
aurex.security.dev-admin.password=${AUREX_DEV_ADMIN_PASSWORD:}
aurex.security.seed-admin.enabled=${AUREX_SEED_ADMIN_ENABLED:false}

# Deterministic Risk Engine Policy Thresholds
risk.rules.high-amount.threshold=100000
risk.rules.high-amount.score=30

risk.rules.unusual-time.business-start=09:00
risk.rules.unusual-time.business-end=18:00
risk.rules.unusual-time.score=20

risk.rules.duplicate.window-minutes=10
risk.rules.duplicate.score=25

risk.rules.round-amount.unit=10000
risk.rules.round-amount.score=10

risk.rules.transaction-velocity.window-minutes=30
risk.rules.transaction-velocity.threshold=3
risk.rules.transaction-velocity.score=20

risk.rules.vendor-concentration.threshold-percent=70
risk.rules.vendor-concentration.minimum-transactions=3
risk.rules.vendor-concentration.score=15
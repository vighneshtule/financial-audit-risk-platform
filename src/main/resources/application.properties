spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

risk.rules.high-amount.threshold=100000
risk.rules.high-amount.score=30

risk.rules.unusual-time.business-start=09:00
risk.rules.unusual-time.business-end=18:00
risk.rules.unusual-time.score=20

risk.rules.duplicate.window-minutes=10
risk.rules.duplicate.score=25
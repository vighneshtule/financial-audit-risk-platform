spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

risk.rules.high-amount.threshold=100000
risk.rules.high-amount.score=30

risk.rules.unusual-time.business-start=09:00
risk.rules.unusual-time.business-end=18:00
risk.rules.unusual-time.score=20

risk.rules.duplicate.window-minutes=10
risk.rules.duplicate.score=25

risk.rules.round-amount.unit=10000
risk.rules.round-amount.score=10

risk.rules.transaction-velocity.window-minutes=30
risk.rules.transaction-velocity.threshold=3
risk.rules.transaction-velocity.score=20

risk.rules.vendor-concentration.threshold-percent=70
risk.rules.vendor-concentration.minimum-transactions=3
risk.rules.vendor-concentration.score=15
# Production Environment Profile Overrides

# Schema Initialization Strategy
# -----------------------------------------------------------------------
# PRODUCTION SAFETY: schema.sql must NOT run on every startup in production.
# Setting mode=never prevents DDL locks, accidental re-runs, and obscures
# the need for proper migration tooling on schema changes.
#
# First-run database bootstrap (empty production database):
#   Option A — docker-compose (recommended):
#     The postgres service in docker-compose.yml mounts schema.sql into
#     docker-entrypoint-initdb.d/. PostgreSQL runs it automatically on the
#     FIRST start of a fresh volume only. No manual action needed.
#
#   Option B — manual psql (e.g. bare-metal / managed RDS):
#     psql -h <host> -U <user> -d financial_audit -f src/main/resources/schema.sql
#
#   Option C — CI / staging pipeline:
#     psql "$DATABASE_URL" -f src/main/resources/schema.sql
#
# For incremental schema changes, apply ALTER TABLE / CREATE INDEX scripts
# manually (or adopt Flyway/Liquibase) BEFORE updating this file or
# restarting the application.
# -----------------------------------------------------------------------
spring.sql.init.mode=never

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.vighnesh=INFO
logging.level.org.springframework.web=WARN

# Swagger UI: disabled by default in production.
# Set ENABLE_SWAGGER=true in your environment to re-enable (e.g. for staging).
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.path=/swagger-ui.html

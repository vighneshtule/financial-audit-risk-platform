# Production Environment Profile Overrides

# Idempotent Schema Initialization (CREATE TABLE IF NOT EXISTS / CREATE INDEX IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.vighnesh=INFO
logging.level.org.springframework.web=WARN

# Swagger UI configuration for production
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.path=/swagger-ui.html
